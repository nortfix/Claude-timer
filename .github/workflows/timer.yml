name: Claude Timer

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to wait"
        required: true
        default: "5"

jobs:
  timer:
    runs-on: ubuntu-latest

    steps:
      - name: Wait
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          echo "Waiting ${MINUTES} minutes..."
          sleep $(( MINUTES * 60 ))

      - name: Continue
        run: |
          echo "TIMER FINISHED - continue"
